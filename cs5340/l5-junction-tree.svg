<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" viewBox="0 0 820 330" role="img" aria-label="6 节点例子的联结树：C1-C2-C3 一条链，C3 再连 C6 和 C4，C4 连 C5；C3 是根" font-size="13"><text x="24" y="32" font-size="15" font-weight="600" fill="#202c29">6 节点例子的联结树：6 个团、5 条边，选 C3 作根</text><g><line x1="110" y1="116" x2="121" y2="116" stroke="#5d6670" stroke-width="1.25"></line><line x1="169" y1="116" x2="180" y2="116" stroke="#5d6670" stroke-width="1.25"></line><line x1="310" y1="116" x2="321" y2="116" stroke="#5d6670" stroke-width="1.25"></line><line x1="383" y1="116" x2="395" y2="116" stroke="#5d6670" stroke-width="1.25"></line><line x1="545" y1="116" x2="573" y2="116" stroke="#5d6670" stroke-width="1.25"></line><line x1="621" y1="116" x2="650" y2="116" stroke="#5d6670" stroke-width="1.25"></line><line x1="470" y1="143" x2="470" y2="174" stroke="#5d6670" stroke-width="1.25"></line><line x1="470" y1="198" x2="470" y2="229" stroke="#5d6670" stroke-width="1.25"></line><line x1="545" y1="256" x2="561" y2="256" stroke="#5d6670" stroke-width="1.25"></line><line x1="623" y1="256" x2="640" y2="256" stroke="#5d6670" stroke-width="1.25"></line></g><g><rect x="121" y="104" width="48" height="24" rx="4" fill="#f4f1f7" stroke="#d9dde3" stroke-width="1"></rect><text x="145" y="120" text-anchor="middle" font-size="11.5" fill="#202c29">X1</text><rect x="321" y="104" width="62" height="24" rx="4" fill="#f4f1f7" stroke="#d9dde3" stroke-width="1"></rect><text x="352" y="120" text-anchor="middle" font-size="11.5" fill="#202c29">X1, X2</text><rect x="573" y="104" width="48" height="24" rx="4" fill="#f4f1f7" stroke="#d9dde3" stroke-width="1"></rect><text x="597" y="120" text-anchor="middle" font-size="11.5" fill="#202c29">X2</text><rect x="439" y="174" width="62" height="24" rx="4" fill="#f4f1f7" stroke="#d9dde3" stroke-width="1"></rect><text x="470" y="190" text-anchor="middle" font-size="11.5" fill="#202c29">X2, X3</text><rect x="561" y="244" width="62" height="24" rx="4" fill="#f4f1f7" stroke="#d9dde3" stroke-width="1"></rect><text x="592" y="260" text-anchor="middle" font-size="11.5" fill="#202c29">X2, X5</text></g><g><rect x="10" y="89" width="100" height="54" rx="8" fill="none" fill-opacity="1" stroke="#5d6670" stroke-width="1.25"></rect><text x="60" y="112" text-anchor="middle" font-weight="600" fill="#202c29">C1：X1</text><text x="60" y="131" text-anchor="middle" font-size="11.5" fill="#68716b">φ1 = p(x1)</text><rect x="180" y="89" width="130" height="54" rx="8" fill="none" fill-opacity="1" stroke="#5d6670" stroke-width="1.25"></rect><text x="245" y="112" text-anchor="middle" font-weight="600" fill="#202c29">C2：X1, X2</text><text x="245" y="131" text-anchor="middle" font-size="11.5" fill="#68716b">φ2 = p(x2 | x1)</text><rect x="395" y="89" width="150" height="54" rx="8" fill="#5b3f73" fill-opacity="0.12" stroke="#5b3f73" stroke-width="2"></rect><text x="470" y="112" text-anchor="middle" font-weight="600" fill="#202c29">C3：X1, X2, X3</text><text x="470" y="131" text-anchor="middle" font-size="11.5" fill="#68716b">φ3 = p(x3 | x1)</text><text x="470" y="81" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b3f73">根</text><rect x="650" y="89" width="130" height="54" rx="8" fill="none" fill-opacity="1" stroke="#5d6670" stroke-width="1.25"></rect><text x="715" y="112" text-anchor="middle" font-weight="600" fill="#202c29">C6：X2, X4</text><text x="715" y="131" text-anchor="middle" font-size="11.5" fill="#68716b">φ6 = p(x4 | x2)</text><rect x="395" y="229" width="150" height="54" rx="8" fill="none" fill-opacity="1" stroke="#5d6670" stroke-width="1.25"></rect><text x="470" y="252" text-anchor="middle" font-weight="600" fill="#202c29">C4：X2, X3, X5</text><text x="470" y="271" text-anchor="middle" font-size="11.5" fill="#68716b">φ4 = p(x5 | x3)</text><rect x="640" y="229" width="150" height="54" rx="8" fill="none" fill-opacity="1" stroke="#5d6670" stroke-width="1.25"></rect><text x="715" y="252" text-anchor="middle" font-weight="600" fill="#202c29">C5：X2, X5, X6</text><text x="715" y="271" text-anchor="middle" font-size="11.5" fill="#68716b">φ5 = p(x6 | x2, x5)</text></g><text x="24" y="316" font-size="11.5" fill="#68716b">圆角框 = 团 Ci（第二行是分到它的团势 φi）　小方块 = 分隔集 Sij = Ci ∩ Cj　高亮 = 根</text></svg>
