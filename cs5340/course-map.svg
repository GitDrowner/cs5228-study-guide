<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="532" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" viewBox="0 0 760 532" role="img" aria-label="全课一条主线：先建模，再推断，学习时还要用推断" font-size="13"><defs><marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d6670"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#202c29">全课一条主线：先建模，再推断，学习时还要用推断</text><g><rect x="24" y="56" width="216" height="392" rx="8" fill="#f4f1f7" stroke="#d9dde3" stroke-width="1"></rect><text x="40" y="84" font-size="15" font-weight="600" fill="#202c29">① 建模</text><text x="40" y="104" font-size="11.5" fill="#68716b">把联合分布拆成小因子</text><rect x="36" y="120" width="192" height="68" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="48" y="144" font-weight="600" fill="#202c29">L2 贝叶斯网络</text><text x="48" y="162" font-size="11.5" fill="#68716b">有向图 · 条件概率表</text><text x="48" y="178" font-size="11.5" fill="#68716b">d-分离 · 马尔可夫毯</text><rect x="36" y="200" width="192" height="68" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="48" y="224" font-weight="600" fill="#202c29">L3 马尔可夫随机场</text><text x="48" y="242" font-size="11.5" fill="#68716b">无向图 · 团上的势函数</text><text x="48" y="258" font-size="11.5" fill="#68716b">道德化 · CRF</text></g><g><rect x="272" y="56" width="216" height="392" rx="8" fill="#f4f1f7" stroke="#d9dde3" stroke-width="1"></rect><text x="288" y="84" font-size="15" font-weight="600" fill="#202c29">② 推断</text><text x="288" y="104" font-size="11.5" fill="#68716b">已知证据，求概率或最优解</text><rect x="284" y="120" width="192" height="68" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="296" y="144" font-weight="600" fill="#202c29">L4 变量消元 · BP</text><text x="296" y="162" font-size="11.5" fill="#68716b">精确 · 任意图求单个查询</text><text x="296" y="178" font-size="11.5" fill="#68716b">树上 sum-product 求全部边缘</text><rect x="284" y="200" width="192" height="68" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="296" y="224" font-weight="600" fill="#202c29">L5 因子图 · 联结树</text><text x="296" y="242" font-size="11.5" fill="#68716b">精确 · 有环图也能求边缘</text><text x="296" y="258" font-size="11.5" fill="#68716b">max-product 求最优组合</text><rect x="284" y="280" width="192" height="68" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="296" y="304" font-weight="600" fill="#202c29">L9 采样 · MCMC</text><text x="296" y="322" font-size="11.5" fill="#68716b">近似 · 用样本平均代替积分</text><text x="296" y="338" font-size="11.5" fill="#68716b">MH · Gibbs · 重要性采样</text><rect x="284" y="360" width="192" height="68" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="296" y="384" font-weight="600" fill="#202c29">L10 变分推断 · 环状 BP</text><text x="296" y="402" font-size="11.5" fill="#68716b">近似 · 用简单的 q 逼近后验</text><text x="296" y="418" font-size="11.5" fill="#68716b">最大化 ELBO = 最小化 KL</text></g><g><rect x="520" y="56" width="216" height="392" rx="8" fill="#f4f1f7" stroke="#d9dde3" stroke-width="1"></rect><text x="536" y="84" font-size="15" font-weight="600" fill="#202c29">③ 学习</text><text x="536" y="104" font-size="11.5" fill="#68716b">从数据估计参数</text><rect x="532" y="120" width="192" height="68" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="544" y="144" font-weight="600" fill="#202c29">L6 数据完整</text><text x="544" y="162" font-size="11.5" fill="#68716b">有向图：计数 / 最小二乘</text><text x="544" y="178" font-size="11.5" fill="#68716b">无向图：梯度 + 推断</text><rect x="532" y="200" width="192" height="68" rx="8" fill="none" stroke="#5d6670" stroke-width="1.25"></rect><text x="544" y="224" font-weight="600" fill="#202c29">L7 有隐变量：EM</text><text x="544" y="242" font-size="11.5" fill="#68716b">E 步：用推断求后验</text><text x="544" y="258" font-size="